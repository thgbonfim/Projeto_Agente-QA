<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA DE DUPLICATAS - CORPORATIVO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #1e40af; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body {
            background-color: #1a1f2b;
            color: white;
        }
    </style>
</head>
<body class="bg-slate-900 p-8 text-slate-200">
    <div class="mx-auto max-w-5xl bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-extrabold mb-8 text-blue-400 flex items-center">
            <span class="mr-3">🏢</span> ERP INVENTÁRIO - MÓDULO DUPLICATAS
        </h1>

        <section class="mb-12 p-6 bg-slate-700 rounded-lg border-l-8 border-blue-500">
            <h2 class="text-xl font-bold mb-6 text-white">Registrar Nova Operação</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm mb-2">Razão Social</label>
                    <input type="text" id="input-razao-social" placeholder="Ex: Accenture Brasil" class="w-full p-3 bg-slate-800 border border-slate-600 rounded focus:border-blue-500 outline-none text-white">
                </div>
                <div>
                    <label class="block text-sm mb-2">CNPJ do Sacado</label>
                    <input type="text" id="input-cnpj" placeholder="00.000.000/0000-00" class="w-full p-3 bg-slate-800 border border-slate-600 rounded focus:border-blue-500 outline-none text-white">
                </div>
                <div>
                    <label class="block text-sm mb-2">Valor Nominal (R$)</label>
                    <input type="number" id="input-valor-operacao" placeholder="0.00" step="0.01" class="w-full p-3 bg-slate-800 border border-slate-600 rounded focus:border-blue-500 outline-none text-white">
                </div>
            </div>
            
            <div class="mt-6 flex items-center gap-4">
                <button id="btn-gerar-duplicata" onclick="processarOperacao()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg transition-all">
                    Confirmar Registro
                </button>
                <div id="loading" class="loader w-8 h-8 border-4 border-slate-600 rounded-full hidden"></div>
                <p id="msg-erro" class="mt-4 font-bold text-lg hidden text-red-500"></p>
            </div>
            
            <p id="feedback-sistema" class="mt-4 font-bold text-lg hidden"></p>
        </section>

        <section>
            <h2 class="text-xl font-bold mb-6 text-white">Inventário de Títulos</h2>
            <div class="overflow-x-auto">
                <table id="lista-duplicatas" class="w-full text-left border-collapse bg-slate-800">
                    <thead>
                        <tr class="text-blue-400 border-b border-slate-600">
                            <th class="p-4 uppercase text-xs">Nº Título</th>
                            <th class="p-4 uppercase text-xs">Empresa / Sacado</th>
                            <th class="p-4 uppercase text-xs">CNPJ</th>
                            <th class="p-4 uppercase text-xs text-right">Valor</th>
                            <th class="p-4 uppercase text-xs text-center">Status</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </section>
    </div>

    <script>
    function processarOperacao() {
        const msgErro = document.getElementById('msg-erro');
        
        // Captura os dados dos inputs
        const razaoSocial = document.getElementById('input-razao-social').value.trim();
        const cnpj = document.getElementById('input-cnpj').value.replace(/[^\d]/g, '').trim();
        const valor = document.getElementById('input-valor-operacao').value.trim();

        // 1. Validação de segurança
        if (razaoSocial === "" || cnpj === "" || valor === "") {
            msgErro.innerText = "Por favor, preencha todos os campos obrigatórios.";
            msgErro.classList.remove('hidden');
            return;
        }

        msgErro.classList.add('hidden');

        // Formatar o CNPJ
        const formattedCNPJ = cnpj.substring(0, 2) + '.' + cnpj.substring(2, 5) + '.' + cnpj.substring(5, 8) + '/' + cnpj.substring(8, 12) + '-' + cnpj.substring(12);

        // 2. Lógica para ADICIONAR NA TABELA (Inventário)
        const novaLinha = document.createElement('tr');
        novaLinha.className = "border-b border-slate-700 hover:bg-slate-700 transition-colors";
        
        novaLinha.innerHTML = `
            <td class="p-4 text-slate-400">TR-${Math.floor(Math.random() * 90000 + 10000)}</td>
            <td class="p-4 font-semibold text-white">${razaoSocial}</td>
            <td class="p-4 text-slate-400">${formattedCNPJ}</td>
            <td class="p-4 text-right text-emerald-400 font-mono">R$ ${parseFloat(valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
            <td class="p-4 text-center">
                <span class="bg-blue-900 text-blue-300 px-3 py-1 rounded-full text-xs">PROCESSADO</span>
            </td>
        `;

        // Insere no topo da lista
        document.getElementById('lista-duplicatas').insertBefore(novaLinha, document.getElementById('lista-duplicatas').firstChild);

        // 3. Limpa campos
        document.getElementById('input-razao-social').value = "";
        document.getElementById('input-cnpj').value = "";
        document.getElementById('input-valor-operacao').value = "";
    }
</script>
</body>
</html>
