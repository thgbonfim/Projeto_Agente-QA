<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA DE DUPLICATAS - CORPORATIVO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #1e40af; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-900 p-8 text-slate-200">
    <div class="mx-auto max-w-5xl bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-extrabold mb-8 text-blue-400 flex items-center">
            <span class="mr-3">🏢</span> ERP INVENTÁRIO - MÓDULO DUPLICATAS
        </h1>

        <section class="mb-12 p-6 bg-slate-700 rounded-lg border-l-8 border-blue-500">
            <h2 class="text-xl font-bold mb-6 text-white">Registrar Nova Operação</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm mb-2">Razão Social</label>
                    <input type="text" id="razao-social" placeholder="Ex: Accenture Brasil" class="w-full p-3 bg-slate-800 border border-slate-600 rounded focus:border-blue-500 outline-none text-white">
                </div>
                <div>
                    <label class="block text-sm mb-2">CNPJ do Sacado</label>
                    <input type="text" id="documento-cnpj" placeholder="00.000.000/0000-00" class="w-full p-3 bg-slate-800 border border-slate-600 rounded focus:border-blue-500 outline-none text-white">
                </div>
                <div>
                    <label class="block text-sm mb-2">Valor Nominal (R$)</label>
                    <input type="number" id="valor-operacao" placeholder="0.00" class="w-full p-3 bg-slate-800 border border-slate-600 rounded focus:border-blue-500 outline-none text-white">
                </div>
            </div>
            
            <div class="mt-6 flex items-center gap-4">
                <button id="btn-gerar-duplicata" onclick="processarOperacao()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg transition-all">
                    Confirmar Registro
                </button>
                <div id="loading" class="loader w-8 h-8 border-4 border-slate-600 rounded-full hidden"></div>
            </div>
            
            <p id="feedback-sistema" class="mt-4 font-bold text-lg hidden"></p>
        </section>

        <section>
            <h2 class="text-xl font-bold mb-6 text-white">Inventário de Títulos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse bg-slate-800">
                    <thead>
                        <tr class="text-blue-400 border-b border-slate-600">
                            <th class="p-4 uppercase text-xs">Nº Título</th>
                            <th class="p-4 uppercase text-xs">Empresa / Sacado</th>
                            <th class="p-4 uppercase text-xs">CNPJ</th>
                            <th class="p-4 uppercase text-xs text-right">Valor</th>
                            <th class="p-4 uppercase text-xs text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="lista-duplicatas">
                        <tr class="border-b border-slate-700 hover:bg-slate-700 transition-colors" data-testid="duplicata-row">
                            <td class="p-4 text-slate-400">#TR-88291</td>
                            <td class="p-4 font-semibold text-white">Accenture Tecnologia Ltda</td>
                            <td class="p-4 text-slate-400">12.345.678/0001-99</td>
                            <td class="p-4 text-right text-emerald-400 font-mono">R$ 50.000,00</td>
                            <td class="p-4 text-center">
                                <span class="bg-emerald-900 text-emerald-300 px-3 py-1 rounded-full text-xs">EM ABERTO</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
    function processarOperacao() {
        const feedback = document.getElementById('feedback-sistema');
        const loader = document.getElementById('loading');
        const btn = document.getElementById('btn-gerar-duplicata');
        const tabela = document.getElementById('lista-duplicatas');
        
        // Captura os dados dos inputs
        const razao = document.getElementById('razao-social').value.trim();
        const cnpj = document.getElementById('documento-cnpj').value.trim();
        const valor = document.getElementById('valor-operacao').value.trim();

        // 1. Validação de segurança
        if (razao === "" || cnpj === "" || valor === "") {
            feedback.innerText = "❌ ERRO: Preencha todos os campos da duplicata!";
            feedback.style.color = "#f87171"; 
            feedback.classList.remove('hidden');
            return;
        }

        // 2. Inicia processamento visual
        btn.disabled = true;
        btn.innerText = "Processando...";
        feedback.classList.add('hidden');
        loader.classList.remove('hidden');

        // 3. Simula delay de integração bancária
        setTimeout(() => {
            loader.classList.add('hidden');
            btn.disabled = false;
            btn.innerText = "Confirmar Registro";
            
            // 4. Lógica para ADICIONAR NA TABELA (Inventário)
            const novaLinha = document.createElement('tr');
            novaLinha.className = "border-b border-slate-700 hover:bg-slate-700 transition-colors";
            // Geramos um número de título aleatório para simular o sistema
            const numTitulo = "TR-" + Math.floor(Math.random() * 90000 + 10000);
            
            novaLinha.innerHTML = `
                <td class="p-4 text-slate-400">#${numTitulo}</td>
                <td class="p-4 font-semibold text-white">${razao}</td>
                <td class="p-4 text-slate-400">${cnpj}</td>
                <td class="p-4 text-right text-emerald-400 font-mono">R$ ${parseFloat(valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                <td class="p-4 text-center">
                    <span class="bg-blue-900 text-blue-300 px-3 py-1 rounded-full text-xs">PROCESSADO</span>
                </td>
            `;

            // Insere no topo da lista
            tabela.insertBefore(novaLinha, tabela.firstChild);

            // 5. Mostra sucesso e limpa campos
            feedback.innerText = "✅ Operação registrada no inventário com sucesso!";
            feedback.classList.remove('hidden');
            feedback.style.color = "#4ade80"; 
            
            document.getElementById('razao-social').value = "";
            document.getElementById('documento-cnpj').value = "";
            document.getElementById('valor-operacao').value = "";
        }, 2500);
    }
</script>
</body>
</html>
